
name: Security report
description: Report a security issue (avoid posting sensitive exploit details publicly).
title: "[Security]: "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post weaponized exploit details publicly.**
        Use the template and keep PoCs safe/non-destructive.
  - type: textarea
    id: findings
    attributes:
      label: Security findings
      description: Paste `templates/SECURITY_FINDINGS.md` and fill it in.
    validations:
      required: true
